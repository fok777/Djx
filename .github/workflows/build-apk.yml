name: Build R2B APK (Release)

on:
  push:
    branches: [ main, master, build-test ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run backend self-audit
        run: python3 -m r2b_mcp.audit

      - name: Regenerate tools_data.json
        run: python3 tools/gen_tools_data.py

      # 不用第三方 setup-android 动作（该动作在新 runner 上常失败），
      # 直接装官方 cmdline-tools，行为可控。
      - name: Install Android SDK (cmdline-tools)
        run: |
          set -x
          CMDLINE_ZIP=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip \
            "https://dl.google.com/android/repository/$CMDLINE_ZIP"
          unzip -q tools.zip
          rm -f tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Build Release APK (not debuggable)
        working-directory: app
        run: |
          export AJ=$ANDROID_HOME/platforms/android-35/android.jar
          export AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt2
          export D8=$ANDROID_HOME/build-tools/35.0.0/d8
          export APKSIGN=$ANDROID_HOME/build-tools/35.0.0/apksigner
          bash build.sh 2>&1 | tee build.log

      # 诊断意图：日志下载域名在本环境被拦，故用 ::notice:: 把关键信息回传，
      # 可从 check-runs annotations API 读到。
      - name: Verify Release (debuggable must be false)
        working-directory: app
        continue-on-error: true
        run: |
          AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt2
          APKSIGN=$ANDROID_HOME/build-tools/35.0.0/apksigner
          APK=R2B.app.apk
          echo "::notice::pwd=$(pwd) files=$(ls | tr '\n' ' ')"
          if [ -f "$APK" ]; then
            echo "::notice::apk-exists=yes size=$(stat -c%s "$APK")"
          else
            echo "::error::apk-missing R2B.app.apk"
            exit 1
          fi
          OUT=$($AAPT dump badging "$APK" 2>&1)
          echo "::notice::badging-rc=$?"
          echo "::notice::badging-head=$(echo "$OUT" | head -4 | tr '\n' ' ')"
          echo "::notice::has-debuggable-flag=$(echo "$OUT" | grep -c 'application-debuggable')"
          echo "::notice::manifest-debuggable-line=$(grep -n 'debuggable' AndroidManifest.xml || echo none)"
          echo "--- 签名 ---"
          $APKSIGN verify --print-certs "$APK" 2>&1 | head -5 || true
          if echo "$OUT" | grep -q "application-debuggable"; then
            echo "::error::这是 debug 包（application-debuggable 命中）"
            exit 1
          fi
          echo "OK: 非 debug（Release）"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: R2B-app-release
          path: app/R2B.app.apk
          if-no-files-found: error

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: R2B ${{ github.ref_name }}
          body: |
            安卓逆向 MCP 客户端（Release 构建，非 debug）。

            - 内置 375 个工具定义
            - 应用内可起 MCP Streamable HTTP 服务（默认 5051）
            - 二次元 App 图标 + 悬浮窗图标 + 10 个分类图标
          files: app/R2B.app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
