name: Build R2B APK (Release)

on:
  push:
    branches: [ main, master, build-test ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发 Release 需要写权限，默认 GITHUB_TOKEN 可能只有读权限
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run backend self-audit
        run: python3 -m r2b_mcp.audit

      - name: Regenerate tools_data.json
        run: python3 tools/gen_tools_data.py

      # 不用第三方 setup-android 动作（该动作在新 runner 上常失败），
      # 直接装官方 cmdline-tools，行为可控。
      - name: Install Android SDK (cmdline-tools)
        run: |
          set -x
          CMDLINE_ZIP=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip \
            "https://dl.google.com/android/repository/$CMDLINE_ZIP"
          unzip -q tools.zip
          rm -f tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      # radare2 本体（22 个 libr_*.so）不在仓库里，构建时从官方 release 取。
      # 缺失会导致 R2_* 94 个 + Nav_* 23 个工具全部不可用。
      - name: Fetch radare2 android-aarch64
        run: |
          set -x
          mkdir -p assets/engine/radare2
          cd /tmp
          curl -sSL -o r2.tar.gz \
            https://github.com/radareorg/radare2/releases/download/6.2.2/radare2-6.2.2-android-aarch64.tar.gz
          ls -lh r2.tar.gz
          mkdir -p r2x && tar -xzf r2.tar.gz -C r2x --strip-components=1
          find r2x -name "libr_*.so" | head -30
          N=$(find r2x -name "libr_*.so" | wc -l)
          echo "::notice::radare2-libr-count=$N"
          if [ "$N" -gt 0 ]; then
            find r2x -name "libr_*.so" -exec cp {} "$GITHUB_WORKSPACE/assets/engine/radare2/" \;
            find r2x -name "libcapstone*.so" -o -name "libdemumble*.so" | \
              xargs -r -I{} cp {} "$GITHUB_WORKSPACE/assets/engine/radare2/" 2>/dev/null || true
          fi
          ls "$GITHUB_WORKSPACE/assets/engine/radare2/" | head -30

      # frida-server 解压后约 50MB，超过 GitHub blob API 单文件上限，
      # 因此不进 git 仓库，构建时从官方 release 取（xz 压缩包 14.9MB）。
      - name: Fetch frida-server
        continue-on-error: true
        run: |
          set -x
          VER=17.5.1
          DEST="$GITHUB_WORKSPACE/assets/engine/frida/frida-server"
          URL=https://github.com/frida/frida/releases/download/$VER/frida-server-$VER-android-arm64.xz
          cd /tmp
          curl -fsSL -o fs.xz "$URL"
          echo "::notice::frida-xz-size=$(stat -c%s fs.xz 2>/dev/null || echo 0)"
          if command -v xz >/dev/null; then
            xz -dk fs.xz || xz -d -f fs.xz || true
          else
            python3 -c "import lzma,shutil;shutil.copyfileobj(lzma.open('fs.xz'),open('fs.bin','wb'))" || true
            mv fs.bin frida-server-$VER-android-arm64 2>/dev/null || true
          fi
          ls -lh /tmp | head -20
          SRC=$(ls frida-server-$VER-android-arm64 2>/dev/null || echo "")
          if [ -n "$SRC" ]; then
            cp "$SRC" "$DEST"
            echo "::notice::frida-server-installed=$(stat -c%s "$DEST")"
          else
            echo "::warning::frida-server 下载或解压失败，该引擎将缺失"
          fi

      - name: Build Release APK (not debuggable)
        working-directory: app
        run: |
          # pipefail：不加的话 `bash build.sh | tee` 的退出码来自 tee，
          # build.sh 失败也会被判成成功
          set -o pipefail
          export AJ=$ANDROID_HOME/platforms/android-35/android.jar
          export AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt2
          export D8=$ANDROID_HOME/build-tools/35.0.0/d8
          export APKSIGN=$ANDROID_HOME/build-tools/35.0.0/apksigner
          bash build.sh 2>&1 | tee build.log

      # 诊断意图：日志下载域名在本环境被拦，故用 ::notice:: 把关键信息回传，
      # 可从 check-runs annotations API 读到。
      - name: Dump build log (diagnostic)
        if: always()
        working-directory: app
        continue-on-error: true
        run: |
          echo "::notice::buildlog-tail=$(tail -30 build.log 2>/dev/null | tr '\n' '|')"
          echo "::notice::ls-app=$(ls -la | tr '\n' '|')"

      - name: Verify Release (debuggable must be false)
        working-directory: app
        run: |
          AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt2
          APKSIGN=$ANDROID_HOME/build-tools/35.0.0/apksigner
          APK=R2B.app.apk
          [ -f "$APK" ] || { echo "::error::缺少 $APK"; exit 1; }
          echo "APK 大小: $(stat -c%s "$APK") 字节"
          OUT=$($AAPT dump badging "$APK" 2>&1)
          echo "$OUT" | grep -E "^package|sdkVersion" || true
          if echo "$OUT" | grep -q "application-debuggable"; then
            echo "::error::这是 debug 包"; exit 1
          fi
          echo "OK: 非 debug（Release）"
          echo "--- 签名 ---"
          $APKSIGN verify --print-certs "$APK" 2>&1 | head -6 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: R2B-app-release
          path: app/R2B.app.apk
          if-no-files-found: error

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: R2B ${{ github.ref_name }}
          body: |
            安卓逆向 MCP 客户端（Release 构建，非 debug）。

            - 内置 375 个工具定义
            - 应用内可起 MCP Streamable HTTP 服务（默认 5051）
            - 二次元 App 图标 + 悬浮窗图标 + 10 个分类图标
          files: app/R2B.app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
